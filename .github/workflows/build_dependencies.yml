name: Conan Build

on:
  workflow_call:
    inputs:
      platform:
        required: false
        default: 'ubuntu-24.04'
        type: string
      branch:
        required: true
        type: string
      build-type:
        required: true
        type: string
      malloc-impl:
        required: true
        type: string
      prerelease:
        required: true
        type: string
      tooling:
        required: false
        type: string
        default: 'None'
      testing:
        required: false
        type: string
        default: 'False'
      compiler:
        required: false
        type: string
        default: 'gcc'
      conan-channel:
        required: false
        type: string
        default: 'dev'
  workflow_dispatch:
    inputs:
      platform:
        required: true
        type: choice
        options:
          - ubuntu-24.04
        default: 'ubuntu-24.04'
      branch:
        required: true
        type: string
      build-type:
        required: true
        type: choice
        options:
          - Debug
          - Release
          - RelWithDebInfo
      malloc-impl:
        description: 'Allocation Library'
        required: true
        type: choice
        options:
          - libc
          - tcmalloc
          - jemalloc
      prerelease:
        description: 'Fault Instrumentation'
        required: false
        type: choice
        options:
          - 'True'
          - 'False'
        default: 'False'
      tooling:
        required: false
        type: choice
        options:
          - 'Sanitize'
          - 'Coverage'
          - 'None'
        default: 'None'
      testing:
        description: 'Build and Run'
        required: true
        type: choice
        options:
          - 'True'
          - 'False'
        default: 'True'
      compiler:
        required: false
        type: choice
        options:
          - gcc
        default: gcc
      conan-channel:
        required: false
        type: string
        default: 'dev'

jobs:
  BuildHomeObjectDeps:
    runs-on: ${{ inputs.platform }}
    steps:
    - name: Retrieve Code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch }}
      if: ${{ inputs.testing == 'True' }}

    - name: Retrieve Recipe
      uses: actions/checkout@v4
      with:
        repository: eBay/HomeObject
        ref: ${{ inputs.branch }}
      if: ${{ inputs.testing == 'False' }}

    - name: Setup Conan
      uses: ebay/sisl/.github/actions/setup_conan2@dev/v14.x
      with:
        platform: ${{ inputs.platform }}
        compiler: ${{ inputs.compiler }}
      if: ${{ inputs.testing == 'True' || steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Load HomeObject Cache
      id: restore-cache
      uses: eBay/sisl/.github/actions/load_conan2@dev/v14.x
      with:
        testing: ${{ inputs.testing }}
        key_prefix: HomeObjectDeps-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}-${{ inputs.prerelease }}

    - name: Retrieve Dependencies Sisl
      uses: actions/checkout@v4
      with:
        repository: eBay/sisl
        path: import/sisl
        ref: dev/v14.x
      if: ${{ inputs.testing == 'True' || steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Load Sisl Cache
      uses: eBay/sisl/.github/actions/load_conan2@dev/v14.x
      with:
        testing: 'False'
        path: import/sisl
        key_prefix: SislDeps14-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}-${{ inputs.compiler }}
        fail_on_cache_miss: true
      if: ${{ inputs.testing == 'True' || steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Retrieve Dependencies IOMgr
      uses: actions/checkout@v4
      with:
        repository: eBay/iomanager
        path: import/iomgr
        ref: dev/v13.x
      if: ${{ inputs.testing == 'True' || steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Load IOMgr Cache
      uses: eBay/sisl/.github/actions/load_conan2@dev/v14.x
      with:
        testing: 'False'
        path: import/iomgr
        key_prefix: IOMgrDeps-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}-${{ inputs.compiler }}
        fail_on_cache_miss: true
      if: ${{ inputs.testing == 'True' || steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Retrieve Dependencies NuRaftMesg
      uses: actions/checkout@v4
      with:
        repository: eBay/nuraft_mesg
        path: import/nuraft_mesg
        ref: dev/v5.x
      if: ${{ inputs.testing == 'True' || steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Load NuRaftMesg Cache
      uses: eBay/sisl/.github/actions/load_conan2@dev/v14.x
      with:
        testing: 'False'
        path: import/nuraft_mesg
        key_prefix: NuMesgDeps-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}
        fail_on_cache_miss: true
      if: ${{ inputs.testing == 'True' || steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Retrieve Dependencies HomeStore
      uses: actions/checkout@v4
      with:
        repository: eBay/HomeStore
        path: import/homestore
        ref: dev/v8.x
      if: ${{ inputs.testing == 'True' || steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Load HomeStore Cache
      uses: eBay/sisl/.github/actions/load_conan2@dev/v14.x
      with:
        testing: 'False'
        path: import/homestore
        key_prefix: HomestoreDeps-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}
        fail_on_cache_miss: true
      if: ${{ inputs.testing == 'True' || steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Export Recipes
      run: |
        sudo apt-get install -y python3-pyelftools libaio-dev
        python -m pip install pyelftools
        sudo rm -rf $ANDROID_HOME

        pushd import/sisl
        ./prepare_v2.sh
        conan export --user oss --channel ${{ inputs.conan-channel }} .
        popd

        pushd import/iomgr
        conan export --user oss --channel ${{ inputs.conan-channel }} .
        popd

        pushd import/nuraft_mesg
        ./prepare_v2.sh
        conan export --user oss --channel ${{ inputs.conan-channel }} .
        popd

        pushd import/homestore
        conan export --user oss --channel ${{ inputs.conan-channel }} .
        popd
      if: ${{ inputs.testing == 'True' || steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Build Cache
      run: |
        pre=$([[ "${{ inputs.build-type }}" != "Debug" ]] && echo "-o iomgr/*:prerelease=${{ inputs.prerelease }}" || echo "")
        echo "Disk space usage"
        sudo df -h
        sudo ls -l /tmp
        echo "Disk space usage after cleanup"
        sudo df -h
        conan install \
            ${pre} \
            -o sisl/*:malloc_impl=${{ inputs.malloc-impl }} \
            -o iomgr/*:testing=off \
            -o homestore/*:testing=off \
            -s:h build_type=${{ inputs.build-type }} \
            -c tools.build:skip_test=True \
            --format=json \
            --build missing \
            . > ~/build.json
        conan list --graph ~/build.json --graph-binaries=build,cache --format=json > ~/pkglist.json
      if: ${{ steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Save Conan Cache
      uses: eBay/sisl/.github/actions/store_conan2@dev/v14.x
      with:
        key_prefix: HomeObjectDeps-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}-${{ inputs.prerelease }}
      if: ${{ github.event_name != 'pull_request' && steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Reload Sisl Cache
      uses: eBay/sisl/.github/actions/load_conan2@dev/v14.x
      with:
        testing: 'False'
        path: import/sisl
        key_prefix: SislDeps14-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}-${{ inputs.compiler }}
        fail_on_cache_miss: true
      if: ${{ inputs.testing == 'True' && github.event_name != 'pull_request' && steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Reload IOMgr Cache
      uses: eBay/sisl/.github/actions/load_conan2@dev/v14.x
      with:
        testing: 'False'
        path: import/iomgr
        key_prefix: IOMgrDeps-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}-${{ inputs.compiler }}
        fail_on_cache_miss: true
      if: ${{ inputs.testing == 'True' && github.event_name != 'pull_request' && steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Reload NuRaftMesg Cache
      uses: eBay/sisl/.github/actions/load_conan2@dev/v14.x
      with:
        testing: 'False'
        path: import/nuraft_mesg
        key_prefix: NuMesgDeps-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}
        fail_on_cache_miss: true
      if: ${{ inputs.testing == 'True' && github.event_name != 'pull_request' && steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Reload HomeStore Cache
      uses: eBay/sisl/.github/actions/load_conan2@dev/v14.x
      with:
        testing: 'False'
        path: import/homestore
        key_prefix: HomestoreDeps-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}
        fail_on_cache_miss: true
      if: ${{ inputs.testing == 'True' && github.event_name != 'pull_request' && steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Create and Test Package
      run: |
        sanitize=$([[ "${{ inputs.tooling }}" == "Sanitize" ]] && echo "True" || echo "False")
        pre=$([[ "${{ inputs.build-type }}" != "Debug" ]] && echo "-o iomgr/*:prerelease=${{ inputs.prerelease }}" || echo "")
        conan create \
            ${pre} \
            -o sisl/*:malloc_impl=${{ inputs.malloc-impl }} \
            -o iomgr/*:testing=off \
            -o homestore/*:testing=off \
            -o homeobject/*:sanitize=${sanitize} \
            -s:h build_type=${{ inputs.build-type }} \
            ${{ inputs.conan-channel != '' && format('--user oss --channel {0}', inputs.conan-channel) || '' }} \
            --build missing \
            .
      if: ${{ inputs.testing == 'True' && inputs.tooling != 'Coverage' }}

    - name: Code Coverage Run
      run: |
        pre=$([[ "${{ inputs.build-type }}" != "Debug" ]] && echo "-o iomgr/*:prerelease=${{ inputs.prerelease }}" || echo "")
        conan build \
            ${pre} \
            -o sisl/*:malloc_impl=${{ inputs.malloc-impl }} \
            -o iomgr/*:testing=off \
            -o homestore/*:testing=off \
            -o homeobject/*:coverage=True \
            -s:h build_type=${{ inputs.build-type }} \
            --build missing \
            .
      if: ${{ inputs.testing == 'True' && inputs.tooling == 'Coverage' }}

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
      if: ${{ inputs.testing == 'True' && inputs.tooling == 'Coverage' }}
